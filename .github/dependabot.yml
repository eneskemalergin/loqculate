# Dependabot: weekly grouped bumps. Scientific stack is separate from
# tooling so a numpy/scipy bump is not mixed with ruff/pytest noise.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 4
    groups:
      scientific-stack:
        patterns:
          - "numpy"
          - "scipy"
          - "pandas"
          - "matplotlib"
          - "lmfit"
          - "tqdm"
      python-tooling:
        patterns:
          - "pytest*"
          - "ruff"
          - "pre-commit"
          - "coverage"
          - "setuptools"
          - "wheel"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
