name: CI

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**/*.md"
      - "assets/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
          cache-suffix: lint-3.12

      - name: Install
        run: uv sync --frozen --dev

      - name: Ruff
        run: |
          uv run ruff check loqculate/ tests/
          uv run ruff format --check loqculate/ tests/

  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 / Py3.10
            os: ubuntu-24.04
            python-version: "3.10"
            coverage: "false"
          - name: Linux x64 / Py3.11
            os: ubuntu-24.04
            python-version: "3.11"
            coverage: "false"
          - name: Linux x64 / Py3.12
            os: ubuntu-24.04
            python-version: "3.12"
            coverage: "true"
          - name: Linux arm64 / Py3.12
            os: ubuntu-24.04-arm
            python-version: "3.12"
            coverage: "false"
          - name: macOS arm64 / Py3.12
            os: macos-15
            python-version: "3.12"
            coverage: "false"
          - name: macOS x64 / Py3.12
            os: macos-15-intel
            python-version: "3.12"
            coverage: "false"
          - name: Windows x64 / Py3.12
            os: windows-latest
            python-version: "3.12"
            coverage: "false"
          - name: Windows arm64 / Py3.12
            os: windows-11-arm
            python-version: "3.12"
            coverage: "false"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: ${{ matrix.os }}-${{ matrix.python-version }}

      - name: Install
        run: uv sync --frozen --dev

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: >-
          uv run pytest tests/ -q
          ${{ matrix.coverage == 'true' && format('--cov=loqculate --cov-report=xml --cov-report=term-missing') || '' }}

      - name: Upload coverage
        if: matrix.coverage == 'true'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check dependent jobs
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }}"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
