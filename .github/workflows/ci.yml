name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**/*.md"
      - "assets/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.3"

      - name: Ruff
        run: |
          ruff check --fix --exit-non-zero-on-fix loqculate/
          ruff check loqculate/

  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full Python matrix on Linux x64 only.
          - name: Linux x64 / Py3.10
            os: ubuntu-24.04
            python-version: "3.10"
            coverage: "false"
          - name: Linux x64 / Py3.11
            os: ubuntu-24.04
            python-version: "3.11"
            coverage: "false"
          - name: Linux x64 / Py3.12
            os: ubuntu-24.04
            python-version: "3.12"
            coverage: "true"
          # One Python version on each remaining OS/arch (6 platforms total).
          - name: Linux arm64 / Py3.12
            os: ubuntu-24.04-arm
            python-version: "3.12"
            coverage: "false"
          - name: macOS arm64 / Py3.12
            os: macos-15
            python-version: "3.12"
            coverage: "false"
          - name: macOS x64 / Py3.12
            os: macos-15-intel
            python-version: "3.12"
            coverage: "false"
          - name: Windows x64 / Py3.12
            os: windows-latest
            python-version: "3.12"
            coverage: "false"
          - name: Windows arm64 / Py3.12
            os: windows-11-arm
            python-version: "3.12"
            coverage: "false"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: >-
          pytest tests/ -q --tb=short
          ${{ matrix.coverage == 'true' && format('--cov=loqculate --cov-report=xml --cov-report=term-missing') || '' }}

      - name: Upload coverage
        if: matrix.coverage == 'true'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # Single required check for branch protection: lint + every matrix cell.
  # paths-ignore applies only to push (not PRs) so required checks are not skipped on docs PRs.
  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check dependent jobs
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }}"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
